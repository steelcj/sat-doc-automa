# ff-manifest-vishpala-eleventy-mvp.yaml
#
# Declares which sat-doc-automa artifacts should be present in
# vishpala-eleventy-mvp, at source == dest per the standard layout.
# Per-target sync state lives in <local_target_repo_path>/.file-fairy-state.yaml,
# written by `ff apply`, not here. This file only declares what belongs;
# it does not track what is currently applied.
#
# Deliberately excludes devops-scripts (bump-version.py, cut-release.py,
# publish-release.py, test_publish_release.py), the standard repository
# layout scopes these to "release-managed repositories" specifically.
# vishpala-eleventy-mvp deploys continuously (push to main, host
# rebuilds), with no tagged-tarball release concept, so they don't fit
# today. Revisit if that changes. check-conformance.py is included below
# regardless, since the standard lists it as unconditionally
# "recommended," not release-management-gated.

version: "0.0.1"
remote_source_repo: "steelcj/sat-doc-automa"
remote_target_repo: "steelcj/vishpala-eleventy-mvp"
local_source_repo_path: "~/2-areas/development/sat-doc-automa"
local_target_repo_path: "~/2-areas/development/sites/vishpala-eleventy-mvp"

groups:
  devops-gitignore:
    sync_mode: seed_if_missing
    description: >
      Sensible defaults for repos using the release ceremony. Seeded
      once; never overwrites a repo's own .gitignore afterward.
    items:
      - source: en/docs/automa/devops/gitignore--release-artifacts.gitignore
        dest: .gitignore
  devops-scripts:
    description: >
      Release-tooling scripts. sat currently carries a divergent
      bump-sat-version.py (VERSION plus a README sat_version propagation)
      in place of the standard trio. This group brings the canonical
      scripts; the divergent one is removed by hand (a sync adds, it does
      not delete) and sat's README sat_version line is either hand-
      maintained or dropped.
    items:
      - source: bump-version.py
        dest: bump-version.py
      - source: cut-release.py
        dest: cut-release.py
      - source: check-conformance.py
        dest: check-conformance.py
      - source: normalize-metadata.py
        dest: normalize-metadata.py
      - source: publish-release.py
        dest: publish-release.py
      - source: test_publish_release.py
        dest: test_publish_release.py
    notes:
      - "Remove sat/bump-sat-version.py after this group applies."
      - "Decide sat/README.md sat_version: hand-maintain or drop the line."

  devops-docs:
    description: >
      The workflow check-conformance.py implements, and the fairy's own
      operating guide.
    items:
      - source: en/docs/guides/devops/commit-and-versioning-workflow-v0-3-0.md
        dest: en/docs/guides/devops/commit-and-versioning-workflow-v0-3-0.md
      - source: en/docs/guides/file-fairy/file-fairy-usage-v0-1-1.md
        dest: en/docs/guides/file-fairy/file-fairy-usage-v0-1-1.md

  markdown-automa:
    description: >
      Standing markdown house rules, enforced by check-conformance.py.
      Adopted here, not yet applied as an editing pass across existing
      documents, see ROADMAP.md's Open work section.
    items:
      - source: en/docs/automa/markdown/defaults/markdown--no-heading-numbers-v0-4-1.md
        dest: en/docs/automa/markdown/defaults/markdown--no-heading-numbers-v0-4-1.md
      - source: en/docs/automa/markdown/defaults/markdown--no-horizontal-rules-v0-3-1.md
        dest: en/docs/automa/markdown/defaults/markdown--no-horizontal-rules-v0-3-1.md
      - source: en/docs/automa/markdown/defaults/markdown--use-commas-not-em-dashes-v0-3-1.md
        dest: en/docs/automa/markdown/defaults/markdown--use-commas-not-em-dashes-v0-3-1.md
      - source: en/docs/automa/markdown/defaults/markdown--no-hard-line-wraps-v0-1-0.md
        dest: en/docs/automa/markdown/defaults/markdown--no-hard-line-wraps-v0-1-0.md
      - source: en/docs/automa/markdown/defaults/markdown--license-statement-templates-v0-3-1.md
        dest: en/docs/automa/markdown/defaults/markdown--license-statement-templates-v0-3-1.md
      - source: en/docs/automa/markdown/defaults/markdown--apa-7-citations-using-citation-anchor-pairs-v0-1-0.md
        dest: en/docs/automa/markdown/defaults/markdown--apa-7-citations-using-citation-anchor-pairs-v0-1-0.md

  ai-collaboration:
    description: >
      The standing directives every AI collaboration session follows.
      Both the pre-existing canonical doc and the one distilled directly
      from working with Claude on this repository are included; the
      relationship between the two hasn't been formally resolved yet
      (see the note in the delivery message this manifest shipped with).
    items:
      - source: en/docs/automa/ai-collaboration/defaults/collaboration--energy-conservation-in-ai-collaborations-v0-2-0.md
        dest: en/docs/automa/ai-collaboration/defaults/collaboration--energy-conservation-in-ai-collaborations-v0-2-0.md
      - source: en/docs/automa/ai-collaboration/examples/conserving-bandwidth-and-compute-with-claude.md
        dest: en/docs/automa/ai-collaboration/examples/conserving-bandwidth-and-compute-with-claude.md

  license-blocks:
    description: >
      Reusable License-section snippets, copied so README.md's License
      section is assembled from canonical text rather than re-derived by
      eye. license-block--agpl-3-0-or-later.md was renamed upstream to
      license-block--gpl-3-0-or-later.md, fixing the filename/content
      mismatch flagged in this manifest's previous version (the file's
      actual content was always plain GPL-3.0-or-later, never AGPL).
    items:
      - source: en/docs/automa/licenses/license-block--gpl-3-0-or-later.md
        dest: en/docs/automa/licenses/license-block--gpl-3-0-or-later.md
      - source: en/docs/automa/licenses/license-block--code-and-code-docs--gpl-3-0-or-later.md
        dest: en/docs/automa/licenses/license-block--code-and-code-docs--gpl-3-0-or-later.md
      - source: en/docs/automa/licenses/license-block--content-cc-by-4-0.md
        dest: en/docs/automa/licenses/license-block--content-cc-by-4-0.md

  claude-md:
    description: >
      The shared CLAUDE.md signpost, a fairy-owned block at the top of
      the target's CLAUDE.md; everything below the markers is this
      repository's own. Requires file-fairy 0.4.0 or later.
    items:
      - block: claude-md-signpost
        source: en/docs/automa/claude-md/claude-md-signpost-block.md
        dest: CLAUDE.md
        anchor: BOF

  style-guides:
    sync_mode: reference_only
    description: >
      Style guides are cited by versionless slug, never copied; a copy
      is exactly the drift the shared zone exists to prevent. This group
      records that they are in force here without syncing anything.
    items: []

  retired:
    description: >
      Paths previously synced at a now-stale location, after an
      upstream move/rename. Declaring these as state: absent removes the
      orphaned copies this manifest's earlier version placed here.
    items:
      - state: absent
        dest: en/docs/automa/ai-collaboration/conserving-bandwidth-and-compute-with-claude.md
      - state: absent
        dest: en/docs/automa/licenses/license-block--agpl-3-0-or-later.md
